[package]
name = "rizzardry"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Rust and Bevy rewrite of Wizardry 8"
publish = false

[dependencies]
bevy = { version = "0.20.0", features = ["asset_processor", "tga", "wayland"] }
avian3d = "0.8.0"
bevy-tnua = "0.33.0"
bevy-tnua-avian3d = "0.13.0"
bevy_enhanced_input = "0.27.0"
# Bevy 0.20 support is not released yet. Landmass pins its upgrade branch
# (andriyDev/landmass PR #195). Rerecast is vendored from its upgrade branch
# (janhohenheim/rerecast PR #63) with one fix; see third_party/README.md.
# Move both to crates.io releases once they are published.
bevy_landmass = { git = "https://github.com/andriyDev/landmass", rev = "945b31cf1e" }
rerecast = { path = "third_party/rerecast" }
thiserror = "2"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }

# Dependencies compile with optimisations so the game stays playable in debug.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[lints.clippy]
# Bevy systems receive their data as parameters; many is normal.
too_many_arguments = "allow"
type_complexity = "allow"
