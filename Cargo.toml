[package]
name = "rizzardry"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Rust and Bevy rewrite of Wizardry 8"
publish = false

[dependencies]
bevy = { version = "0.20.0", features = ["system_clipboard", "mp3", "tga", "wav", "wayland"] }
# Colliders come from gameplay collision data, never render meshes or scenes.
avian3d = { version = "0.8.0", default-features = false, features = ["3d", "parry-f32", "parallel", "xpbd_joints"] }
bevy-tnua = "0.33.0"
bevy-tnua-avian3d = "0.13.0"
bevy_enhanced_input = "0.27.0"
bevy_landmass = "0.13.0"
# Rerecast 0.5.0 still lacks our contour fixes; see third_party/README.md.
rerecast = { path = "third_party/rerecast" }
thiserror = "2"
blocking = "1.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
num_enum = "0.7.6"
rand = { version = "0.9", features = ["small_rng", "os_rng"] }
rand_chacha = "0.9"
enum-map = "3.1.0"
enumset = "1.1.15"
ron = "0.12"
# Import retail bitmap glyphs into native Bevy text/IME, without a custom editor.
write-fonts = "0.52.0"
png = "0.18"

[features]
# Bevy as a shared library, so a rebuild does not relink the engine into
# every binary. Not for a build that is shipped: build that with
# `--no-default-features`.
default = ["dynamic_linking"]
dynamic_linking = ["bevy/dynamic_linking"]
# Developer conveniences: screenshots, logging, scripted starts.
dev = []

[dev-dependencies]
write-fonts = { version = "0.52.0", features = ["read"] }

# Dependencies compile with optimisations so the game stays playable in debug.
# The binary has no unit tests; don't link a test harness for it.
[[bin]]
name = "rizzardry"
path = "src/main.rs"
test = false

[profile.dev.package."*"]
opt-level = 3
# Full dependency debuginfo made every test binary ~2.4 GB and dominated
# link time; line tables still give usable backtraces.
debug = "line-tables-only"

[profile.dev]
opt-level = 1

# Tests keep the dev profile's opt-level 1: the retail scenarios step the game
# thousands of times, much of it in Bevy's generic code compiled into this
# crate; opt-level 0 made them twice as slow and saved little rebuild time.
[profile.test]
# Full debuginfo of this crate was over a gigabyte of each test binary;
# line tables still give usable backtraces.
debug = "line-tables-only"

[lints.clippy]
# Bevy systems receive their data as parameters; many is normal.
too_many_arguments = "allow"
type_complexity = "allow"
